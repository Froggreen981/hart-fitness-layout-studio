name: Shared layout verification
on:
  pull_request:
  push:
    branches: ['codex/shared-gym-layouts']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check dist/app.js
      - run: node --check worker/service.mjs
      - run: node --test test-*.mjs
      - run: node scripts/build-worker.mjs

